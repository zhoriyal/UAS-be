[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.gd", "php84Extensions.bcmath"]

[phases.install]
dependsOn = ["setup"]
cmds = ["curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer", "COMPOSER_ALLOW_SUPERUSER=1 composer update --no-dev --optimize-autoloader --no-scripts --no-interaction"]

[phases.build]
dependsOn = ["install"]
cmds = ["php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
